apiVersion: v1
kind: Pod
metadata:
  name: grade-submission-portal  
  labels:
    app: grade-submission-portal
    component: frontend
spec:
  containers:
  - name: grade-submission-portal
    image: rslim087/kubernetes-course-grade-submission-portal
    resources:
      limits:        
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi    
    ports:
    - containerPort: 5001
  - name: grade-submission-portal-health-checker
    image:  rslim087/kubernetes-course-grade-submission-portal-health-checker
    resources:
      limits:        
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi