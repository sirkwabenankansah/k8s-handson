# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-api
  namespace: grade-submission  
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grade-submission-api      
  template:
    metadata:
      labels:
        app: grade-submission-api
        component: backend
    spec:
      containers:
      - name: grade-submission-api
        image: rslim087/kubernetes-course-grade-submission-api:stateless
        resources:
          limits:        
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi    
        ports:
        - containerPort: 3000