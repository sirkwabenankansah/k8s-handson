# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-portal
  namespace: grade-submission  
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grade-submission-portal      
  template:
    metadata:
      labels:
        app: grade-submission-portal
        component: frontend
    spec:
      containers:
      - name: grade-submission-portal
        image: rslim087/kubernetes-course-grade-submission-portal
        resources:
          limits:        
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi    
        ports:
        - containerPort: 5001